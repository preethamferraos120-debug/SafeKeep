services:
  - type: web
    name: SafeKeep
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm --prefix backend install && npm --prefix frontend install && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safekeep-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://safekeep-o1c5.onrender.com
databases:
  - name: safekeep-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: safekeep_db_vens
    user: safekeep_db_vens_user
